<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dialogue Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080808;--bg2:#111;--bg3:#181818;--bg4:#222;
  --bd:#252525;--bd2:#333;
  --t:#e0e0e0;--t2:#888;--t3:#444;
  --accent:#fff;
  --green:#4ade80;--red:#f87171;--amber:#fbbf24;--blue:#60a5fa;
  --r:8px;
}
html,body{height:100%;background:var(--bg);color:var(--t);
  font-family:'Noto Sans SC',sans-serif;font-size:14px;line-height:1.6;overflow:hidden}
button{font-family:'Noto Sans SC',sans-serif;cursor:pointer}
input,textarea,select{font-family:'Noto Sans SC',sans-serif}

/* ── Shell ── */
.shell{display:flex;flex-direction:column;height:100vh}
.topbar{height:48px;background:var(--bg2);border-bottom:1px solid var(--bd);
  display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0}
.logo{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.1em;
  color:var(--t3);text-transform:uppercase}
.page-title{font-size:14px;font-weight:500;color:var(--t2)}
.topbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* ── Views ── */
.view{flex:1;overflow:hidden;display:none}
.view.active{display:flex;flex-direction:column}

/* ── Buttons ── */
.btn{padding:6px 14px;border-radius:var(--r);border:1px solid var(--bd2);
  background:none;color:var(--t2);font-size:13px;transition:all .15s;
  display:inline-flex;align-items:center;gap:6px}
.btn:hover{color:var(--t);border-color:var(--t3)}
.btn-primary{background:var(--t);color:var(--bg);border-color:var(--t)}
.btn-primary:hover{background:#ccc;color:var(--bg)}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:5px;border-radius:6px;width:28px;height:28px;
  justify-content:center;font-size:15px}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:var(--bg4);border:1px solid var(--bd2);border-radius:var(--r);
  padding:10px 18px;font-size:13px;color:var(--t);z-index:9999;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ════════════════════════════════════════
   PROJECT LIST VIEW
════════════════════════════════════════ */
#view-projects{padding:32px}
.projects-header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:24px}
.projects-header h1{font-size:20px;font-weight:400}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:14px}
.project-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--r);
  padding:18px;cursor:pointer;transition:border-color .15s}
.project-card:hover{border-color:var(--bd2)}
.project-card-title{font-size:15px;font-weight:500;margin-bottom:6px}
.project-card-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--t3);
  display:flex;gap:12px}
.status-badge{font-family:'DM Mono',monospace;font-size:10px;padding:2px 6px;
  border-radius:4px;letter-spacing:.04em}
.status-draft{background:#1a1a0d;color:var(--amber);border:1px solid rgba(251,191,36,.2)}
.status-voicing{background:#0d1626;color:var(--blue);border:1px solid rgba(96,165,250,.2)}
.status-done{background:#0d1f14;color:var(--green);border:1px solid rgba(74,222,128,.2)}
.new-project-card{background:none;border:1px dashed var(--bd2);border-radius:var(--r);
  padding:18px;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:var(--t3);font-size:14px;min-height:90px}
.new-project-card:hover{border-color:var(--t3);color:var(--t2)}

/* ════════════════════════════════════════
   STUDIO VIEW  (3-column)
════════════════════════════════════════ */
#view-studio{flex-direction:row!important}

/* ── Studio left: script editor ── */
.studio-left{width:380px;min-width:320px;border-right:1px solid var(--bd);
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.panel-head{padding:12px 16px;border-bottom:1px solid var(--bd);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;
  color:var(--t3);text-transform:uppercase}

/* Generate form */
.gen-form{padding:14px 16px;border-bottom:1px solid var(--bd);flex-shrink:0;
  display:flex;flex-direction:column;gap:8px}
.form-row{display:flex;gap:8px}
.form-input{flex:1;background:var(--bg3);border:1px solid var(--bd);border-radius:6px;
  color:var(--t);font-size:13px;padding:7px 10px;outline:none;transition:border-color .15s}
.form-input:focus{border-color:var(--bd2)}
.form-select{background:var(--bg3);border:1px solid var(--bd);border-radius:6px;
  color:var(--t2);font-size:12px;padding:6px 8px;outline:none;cursor:pointer}
.form-select option{background:var(--bg3)}

/* Script rows */
.lines-wrap{flex:1;overflow-y:auto;padding:8px 0}
.lines-wrap::-webkit-scrollbar{width:3px}
.lines-wrap::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:2px}
.line-row{display:grid;grid-template-columns:90px 1fr auto 28px;gap:8px;
  padding:10px 14px;border-bottom:1px solid var(--bd);align-items:start;
  transition:background .1s}
.line-row:hover{background:var(--bg2)}
.line-row.audio-done .line-idx{color:var(--green)}
.line-row.audio-generating .line-idx{color:var(--amber)}
.line-row.audio-error .line-idx{color:#e57373}
.line-duration{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);margin-top:2px}
.line-error{font-size:10px;color:#e57373;margin-top:4px;line-height:1.4}
.line-actions{display:flex;flex-direction:column;gap:4px;align-items:center;padding-top:2px}
.line-act-btn{background:none;border:1px solid var(--bd);color:var(--t2);
  border-radius:4px;width:24px;height:22px;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.line-act-btn:hover:not(:disabled){color:var(--t);border-color:var(--bd2)}
.line-act-btn:disabled{opacity:.25;cursor:default}
.voice-preview-btn{background:var(--bg);border:1px solid var(--bd);color:var(--t2);
  border-radius:4px;font-size:11px;padding:3px 8px;margin-left:6px;cursor:pointer}
.voice-preview-btn:hover:not(:disabled){color:var(--t);border-color:var(--bd2)}
.voice-preview-btn:disabled{opacity:.4;cursor:default}
.line-left{display:flex;flex-direction:column;gap:4px}
.line-idx{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3)}
.speaker-sel{background:none;border:none;color:var(--t2);font-size:12px;
  padding:2px 0;cursor:pointer;outline:none;width:100%}
.speaker-sel option{background:var(--bg3);color:var(--t)}
.line-text{background:none;border:none;color:var(--t);font-size:13px;
  resize:none;outline:none;width:100%;min-height:36px;line-height:1.6;
  padding:2px 0}
.line-text::placeholder{color:var(--t3)}

/* Add line footer */
.lines-footer{padding:10px 14px;border-top:1px solid var(--bd);flex-shrink:0}

/* ── Studio center: card preview ── */
.studio-center{flex:1;display:flex;flex-direction:column;overflow:hidden;
  border-right:1px solid var(--bd)}
.card-preview-area{flex:1;overflow-y:auto;display:flex;flex-direction:column;
  align-items:center;padding:28px 20px;gap:0}

/* Story card */
.story-card{width:100%;max-width:360px;background:#fff;border-radius:14px;
  overflow:hidden;box-shadow:0 2px 20px rgba(0,0,0,.4)}
.card-header{padding:11px 15px;border-bottom:1px solid #f0ede6;
  display:flex;align-items:center;justify-content:space-between;background:#fff}
.card-num-b{width:20px;height:20px;border-radius:50%;background:#f0ede6;
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:500;color:#666}
.card-app-n{font-size:11px;font-weight:500;color:#aaa}
.card-date-t{font-size:10px;color:#ccc}
.card-body{padding:14px;display:flex;flex-direction:column;gap:9px;background:#fff}
.bubble{max-width:84%;padding:8px 12px;border-radius:14px;font-size:13px;
  line-height:1.6;color:#1a1a1a}
.bubble-name{font-size:10px;font-weight:500;margin-bottom:2px}
.bubble.ai{background:#f5f4f0;align-self:flex-start;border-bottom-left-radius:3px}
.bubble.ai .bubble-name{color:#aaa}
.bubble.user{background:#1a1a1a;color:#f0f0f0;align-self:flex-end;border-bottom-right-radius:3px}
.bubble.user .bubble-name{color:#666;text-align:right}
.card-note-t{font-style:italic;font-size:11px;color:#bbb;text-align:center;
  padding:6px 14px 12px;border-top:1px solid #f5f5f5;background:#fff}

/* Nav */
.card-nav{display:flex;align-items:center;justify-content:center;gap:12px;
  padding:14px;flex-shrink:0}
.nav-btn{background:var(--bg2);border:1px solid var(--bd);color:var(--t2);
  border-radius:6px;padding:6px 14px;font-size:12px;transition:all .15s}
.nav-btn:hover:not(:disabled){color:var(--t);border-color:var(--bd2)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-dots{display:flex;gap:5px}
.nav-dot{width:5px;height:5px;border-radius:50%;background:var(--bd2);
  cursor:pointer;transition:background .15s}
.nav-dot.active{background:var(--t2)}

/* ── Studio right: voice + settings ── */
.studio-right{width:260px;min-width:220px;display:flex;flex-direction:column;
  overflow:hidden;flex-shrink:0}
.voice-section{flex:1;overflow-y:auto;padding:14px}
.voice-card{background:var(--bg3);border:1px solid var(--bd);border-radius:var(--r);
  padding:12px;margin-bottom:10px}
.voice-card-name{font-size:13px;font-weight:500;margin-bottom:8px}
.voice-id-row{display:flex;gap:6px;align-items:center}
.voice-id-input{flex:1;background:var(--bg);border:1px solid var(--bd);
  border-radius:6px;color:var(--t2);font-family:'DM Mono',monospace;
  font-size:11px;padding:5px 8px;outline:none}
.voice-params{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.param-group{display:flex;flex-direction:column;gap:2px}
.param-label{font-family:'DM Mono',monospace;font-size:9px;color:var(--t3);
  letter-spacing:.06em;text-transform:uppercase}
.param-input{background:var(--bg);border:1px solid var(--bd);border-radius:4px;
  color:var(--t);font-size:12px;padding:4px 6px;outline:none;text-align:center;width:100%}

/* Action section */
.action-section{border-top:1px solid var(--bd);padding:14px;flex-shrink:0;
  display:flex;flex-direction:column;gap:8px}
.progress-bar{height:2px;background:var(--bd);border-radius:1px;overflow:hidden}
.progress-fill{height:100%;background:var(--t);transition:width .3s;width:0}
.progress-text{font-family:'DM Mono',monospace;font-size:11px;color:var(--t3)}
.action-row{display:flex;gap:8px}

/* ── Overlay loading ── */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.loading-overlay.show{display:flex}
.loading-spinner{width:32px;height:32px;border:2px solid var(--bd2);
  border-top-color:var(--t);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:var(--t2)}
</style>
</head>
<body>

<div class="shell">
  <!-- Topbar -->
  <div class="topbar">
    <span class="logo">Dialogue</span>
    <span class="page-title" id="topbar-title">项目库</span>
    <div class="topbar-right" id="topbar-actions">
      <button class="btn btn-sm" onclick="showProjects()">← 返回项目库</button>
    </div>
  </div>

  <!-- View: Projects -->
  <div class="view active" id="view-projects">
    <div class="projects-header">
      <h1>项目库</h1>
    </div>
    <div class="projects-grid" id="projects-grid">
      <div class="new-project-card" onclick="createProject()">
        <span style="font-size:20px">+</span> 新建项目
      </div>
    </div>
  </div>

  <!-- View: Studio -->
  <div class="view" id="view-studio">

    <!-- Left: Script editor -->
    <div class="studio-left">
      <div class="panel-head">
        <span class="panel-label">脚本编辑器</span>
        <div style="display:flex;gap:6px">
          <button class="btn btn-sm" onclick="toggleGenForm()" id="gen-toggle-btn">AI 生成</button>
          <button class="btn btn-sm" onclick="importJSON()">导入 JSON</button>
          <input id="json-file-input" type="file" accept=".json" style="display:none" onchange="handleJSONImport(event)">
        </div>
      </div>

      <!-- AI Generate Form -->
      <div class="gen-form" id="gen-form" style="display:none">
        <input class="form-input" id="gen-theme" placeholder="故事主题（如：在外工作的人与父母）">
        <div class="form-row">
          <select class="form-select" id="gen-tone" style="flex:1">
            <option value="留白向">留白向</option>
            <option value="温情向">温情向</option>
            <option value="悲剧向">悲剧向</option>
          </select>
          <select class="form-select" id="gen-style" style="flex:1">
            <option value="陪伴感">陪伴感</option>
            <option value="工具感">工具感</option>
            <option value="镜子感">镜子感</option>
          </select>
        </div>
        <input class="form-input" id="gen-characters" placeholder="主要角色（如：38岁工程师，在深圳工作）">
        <button class="btn btn-primary" onclick="generateStory()" style="width:100%;justify-content:center">
          生成故事
        </button>
      </div>

      <div class="lines-wrap" id="lines-container"></div>

      <div class="lines-footer">
        <button class="btn" onclick="addLine()" style="width:100%;justify-content:center;font-size:12px">
          + 添加台词
        </button>
      </div>
    </div>

    <!-- Center: Card preview -->
    <div class="studio-center">
      <div class="panel-head">
        <span class="panel-label">图文卡片预览</span>
        <button class="btn btn-sm" onclick="exportCards()">导出 JSON</button>
      </div>
      <div class="card-preview-area" id="card-preview-area">
        <div style="color:var(--t3);font-size:13px;text-align:center;margin-top:60px">
          在左侧编辑台词或生成故事<br>卡片预览将在此显示
        </div>
      </div>
      <div class="card-nav" id="card-nav" style="display:none">
        <button class="nav-btn" id="nav-prev" onclick="prevCard()">← 上一张</button>
        <div class="nav-dots" id="nav-dots"></div>
        <button class="nav-btn" id="nav-next" onclick="nextCard()">下一张 →</button>
      </div>
    </div>

    <!-- Right: Voice & actions -->
    <div class="studio-right">
      <div class="panel-head">
        <span class="panel-label">音色配置</span>
      </div>
      <div class="voice-section" id="voice-section">
        <div style="color:var(--t3);font-size:12px">
          加载台词后，这里会显示各角色的音色配置。
        </div>
      </div>
      <div class="action-section">
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="progress-text" id="progress-text" style="display:none"></div>
        <div class="action-row">
          <button class="btn" onclick="generateAllVoice()" style="flex:1;justify-content:center" id="btn-voice">
            生成配音
          </button>
          <button class="btn btn-primary" onclick="generateVideo()" style="flex:1;justify-content:center" id="btn-video">
            合成视频
          </button>
        </div>
        <a id="download-link" style="display:none" class="btn btn-primary"
           style="justify-content:center;text-align:center;text-decoration:none">
          下载 MP4
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">生成中...</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────
const API = '';  // same origin
let currentProjectId = null;
let lines = [];           // [{id, speaker, text_raw, text_clean, audio_status}]
let slides = [];          // 分组后的卡片数据
let currentCard = 0;
let voices = {};          // { speaker: { voice_id, speed, vol, pitch } }

const SPEAKERS = ['助理','陈绍明','旁白'];

// ── Utils ─────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDuration(ms) {
  if (!ms) return '';
  const s = ms / 1000;
  if (s < 60) return s.toFixed(1) + 's';
  const m = Math.floor(s/60), r = Math.round(s%60);
  return `${m}:${String(r).padStart(2,'0')}`;
}

let _audioEl = null;
function playUrl(url) {
  if (_audioEl) { _audioEl.pause(); _audioEl = null; }
  _audioEl = new Audio(url);
  _audioEl.play().catch(e => toast('播放失败：' + e.message));
}

function toast(msg, duration=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

function loading(show, text='处理中...') {
  const el = document.getElementById('loading-overlay');
  document.getElementById('loading-text').textContent = text;
  el.classList.toggle('show', show);
}

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({detail: res.statusText}));
    throw new Error(err.detail || res.statusText);
  }
  return res.json();
}

// ── Projects view ─────────────────────────────────────────────
async function loadProjects() {
  const projects = await api('GET', '/api/projects');
  const grid = document.getElementById('projects-grid');
  grid.innerHTML = `<div class="new-project-card" onclick="createProject()">
    <span style="font-size:20px">+</span> 新建项目
  </div>`;
  projects.forEach(p => {
    const statusClass = {draft:'status-draft',voicing:'status-voicing',done:'status-done'}[p.status]||'status-draft';
    const statusText = {draft:'草稿',voicing:'配音中',done:'已完成'}[p.status]||'草稿';
    const div = document.createElement('div');
    div.className = 'project-card';
    div.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="project-card-title">${p.title}</div>
        <span class="status-badge ${statusClass}">${statusText}</span>
      </div>
      <div class="project-card-meta" style="margin-top:8px">
        <span>${p.line_count} 行台词</span>
        <span>${p.updated_at.slice(0,10)}</span>
      </div>`;
    div.onclick = () => openProject(p.id);
    grid.insertBefore(div, grid.firstChild);
  });
}

async function createProject() {
  const title = prompt('项目名称：', '未命名项目');
  if (!title) return;
  loading(true, '创建项目...');
  try {
    const p = await api('POST', '/api/projects', { title });
    await openProject(p.id);
  } catch(e) { toast('创建失败：' + e.message); }
  loading(false);
}

function showProjects() {
  document.getElementById('view-projects').classList.add('active');
  document.getElementById('view-studio').classList.remove('active');
  document.getElementById('topbar-title').textContent = '项目库';
  document.getElementById('topbar-actions').style.display = 'none';
  currentProjectId = null;
  loadProjects();
}

async function openProject(id) {
  loading(true, '加载项目...');
  try {
    const data = await api('GET', `/api/projects/${id}`);
    currentProjectId = id;
    lines = data.lines || [];
    voices = data.voices || {};

    document.getElementById('view-projects').classList.remove('active');
    document.getElementById('view-studio').classList.add('active');
    document.getElementById('topbar-title').textContent = data.title;
    document.getElementById('topbar-actions').style.display = '';

    renderLines();
    buildSlides();
    renderCardPreview();
    renderVoiceSection();
  } catch(e) { toast('加载失败：' + e.message); }
  loading(false);
}

// ── Lines editor ──────────────────────────────────────────────
function renderLines() {
  const c = document.getElementById('lines-container');
  if (!lines.length) {
    c.innerHTML = '<div style="padding:20px;text-align:center;color:var(--t3);font-size:12px">暂无台词，点击「AI 生成」或「添加台词」开始</div>';
    return;
  }
  c.innerHTML = lines.map((l, i) => {
    const cls = l.audio_status==='done'?'audio-done'
              : l.audio_status==='generating'?'audio-generating'
              : l.audio_status==='error'?'audio-error':'';
    const statusGlyph = l.audio_status==='done'?'✓'
              : l.audio_status==='generating'?'…'
              : l.audio_status==='error'?'!':'○';
    const dur = l.duration_ms ? `<span class="line-duration">${formatDuration(l.duration_ms)}</span>` : '';
    const canPlay = l.audio_status==='done';
    const canRedo = l.audio_status==='done' || l.audio_status==='error';
    const errBlock = l.audio_status==='error' && l.error_msg
      ? `<div class="line-error">⚠ ${escapeHtml(l.error_msg)}</div>` : '';
    return `
    <div class="line-row ${cls}" data-id="${l.id}">
      <div class="line-left">
        <span class="line-idx">${String(i+1).padStart(2,'0')} · ${statusGlyph}</span>
        <select class="speaker-sel" onchange="updateLine('${l.id}','speaker',this.value)">
          ${[...new Set([...SPEAKERS, l.speaker])].map(s =>
            `<option value="${s}" ${l.speaker===s?'selected':''}>${s}</option>`
          ).join('')}
        </select>
        ${dur}
      </div>
      <div>
        <textarea class="line-text" rows="2"
          onchange="updateLine('${l.id}','text_raw',this.value)"
          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
        >${l.text_raw}</textarea>
        ${errBlock}
      </div>
      <div class="line-actions">
        <button class="line-act-btn" title="试听" ${canPlay?'':'disabled'}
          onclick="playLineAudio('${l.id}')">▶</button>
        <button class="line-act-btn" title="${canRedo?'重新生成':'生成配音'}"
          onclick="ttsOneLine('${l.id}')">${l.audio_status==='generating'?'…':'↻'}</button>
      </div>
      <button class="btn btn-icon" onclick="deleteLine('${l.id}')"
        style="color:var(--t3);border-color:transparent;font-size:16px;margin-top:2px">×</button>
    </div>`;
  }).join('');
  // auto-resize textareas
  c.querySelectorAll('.line-text').forEach(ta => {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });
}

async function updateLine(id, key, value) {
  const line = lines.find(l => l.id === id);
  if (!line) return;
  line[key] = value;
  if (key === 'text_raw') line.text_clean = value.replace(/<#[\d.]+#>/g,'').trim();
  try {
    await api('PATCH', `/api/projects/${currentProjectId}/lines/${id}`, { [key]: value });
    buildSlides();
    renderCardPreview();
    if (key === 'speaker') renderVoiceSection();
  } catch(e) { toast('保存失败'); }
}

async function addLine() {
  loading(true, '添加台词...');
  try {
    const line = await api('POST', `/api/projects/${currentProjectId}/lines`, {
      speaker: SPEAKERS[0], text_raw: '', index: lines.length
    });
    lines.push(line);
    renderLines();
    buildSlides();
    renderCardPreview();
    renderVoiceSection();
  } catch(e) { toast('添加失败：' + e.message); }
  loading(false);
}

async function deleteLine(id) {
  if (!confirm('删除这条台词？')) return;
  await api('DELETE', `/api/projects/${currentProjectId}/lines/${id}`);
  lines = lines.filter(l => l.id !== id);
  renderLines();
  buildSlides();
  renderCardPreview();
}

// ── Generate form ─────────────────────────────────────────────
function toggleGenForm() {
  const f = document.getElementById('gen-form');
  const btn = document.getElementById('gen-toggle-btn');
  const show = f.style.display === 'none';
  f.style.display = show ? 'flex' : 'none';
  btn.textContent = show ? '收起' : 'AI 生成';
}

async function generateStory() {
  const theme = document.getElementById('gen-theme').value.trim();
  if (!theme) { toast('请输入故事主题'); return; }
  loading(true, 'Claude 生成故事中...');
  try {
    const res = await api('POST', '/api/story/generate', {
      project_id: currentProjectId,
      theme,
      tone: document.getElementById('gen-tone').value,
      ai_style: document.getElementById('gen-style').value,
      characters: document.getElementById('gen-characters').value || '主角',
    });
    // 重新加载项目
    const data = await api('GET', `/api/projects/${currentProjectId}`);
    lines = data.lines || [];
    document.getElementById('topbar-title').textContent = data.title;
    renderLines();
    buildSlides();
    renderCardPreview();
    renderVoiceSection();
    document.getElementById('gen-form').style.display = 'none';
    document.getElementById('gen-toggle-btn').textContent = 'AI 生成';
    toast('故事生成完成！');
  } catch(e) { toast('生成失败：' + e.message); }
  loading(false);
}

// ── JSON import ───────────────────────────────────────────────
function importJSON() { document.getElementById('json-file-input').click(); }

async function handleJSONImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const text = await file.text();
  let json;
  try { json = JSON.parse(text); } catch { toast('JSON 格式错误'); return; }
  loading(true, '导入故事...');
  try {
    await api('POST', '/api/story/import', { project_id: currentProjectId, story_json: json });
    const data = await api('GET', `/api/projects/${currentProjectId}`);
    lines = data.lines || [];
    document.getElementById('topbar-title').textContent = data.title;
    renderLines(); buildSlides(); renderCardPreview(); renderVoiceSection();
    toast('导入成功');
  } catch(e) { toast('导入失败：' + e.message); }
  loading(false);
  e.target.value = '';
}

// ── Card preview ──────────────────────────────────────────────
function buildSlides() {
  // 每 8 行分一张卡，或按原始 slide 分组
  if (!lines.length) { slides = []; return; }
  // 简单按每 6 行分一张卡
  slides = [];
  const chunkSize = 6;
  for (let i = 0; i < lines.length; i += chunkSize) {
    slides.push(lines.slice(i, i + chunkSize));
  }
  if (currentCard >= slides.length) currentCard = slides.length - 1;
}

function renderCardPreview() {
  const area = document.getElementById('card-preview-area');
  const nav  = document.getElementById('card-nav');

  if (!slides.length) {
    area.innerHTML = '<div style="color:var(--t3);font-size:13px;text-align:center;margin-top:60px">在左侧编辑台词或生成故事<br>卡片预览将在此显示</div>';
    nav.style.display = 'none';
    return;
  }

  nav.style.display = 'flex';
  const slide = slides[currentCard];
  const messagesHtml = slide.map(l => {
    const isUser = l.speaker !== '助理';
    return `<div class="bubble ${isUser?'user':'ai'}">
      <div class="bubble-name">${l.speaker}</div>
      ${escHtml(l.text_clean || l.text_raw)}
    </div>`;
  }).join('');

  area.innerHTML = `
    <div class="story-card">
      <div class="card-header">
        <div style="display:flex;align-items:center;gap:7px">
          <div class="card-num-b">${currentCard+1}</div>
          <span class="card-app-n">助理 · 对话记录</span>
        </div>
        <span class="card-date-t">第 ${currentCard+1} 张 / 共 ${slides.length} 张</span>
      </div>
      <div class="card-body">${messagesHtml}</div>
    </div>`;

  // dots
  document.getElementById('nav-dots').innerHTML = slides.map((_,i) =>
    `<div class="nav-dot${i===currentCard?' active':''}" onclick="goCard(${i})"></div>`
  ).join('');
  document.getElementById('nav-prev').disabled = currentCard === 0;
  document.getElementById('nav-next').disabled = currentCard === slides.length - 1;
}

function prevCard() { if (currentCard > 0) { currentCard--; renderCardPreview(); } }
function nextCard() { if (currentCard < slides.length-1) { currentCard++; renderCardPreview(); } }
function goCard(i) { currentCard = i; renderCardPreview(); }

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportCards() {
  if (!lines.length) { toast('没有台词可以导出'); return; }
  const json = {
    title: document.getElementById('topbar-title').textContent,
    slides: slides.map((slide, i) => ({
      num: i+1,
      messages: slide.map(l => ({
        role: l.speaker === '助理' ? 'ai' : 'user',
        name: l.speaker,
        text: l.text_raw,
      }))
    }))
  };
  const blob = new Blob([JSON.stringify(json, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${document.getElementById('topbar-title').textContent}.json`;
  a.click();
}

// ── Voice section ─────────────────────────────────────────────
function renderVoiceSection() {
  const speakers = [...new Set(lines.map(l => l.speaker))];
  const sec = document.getElementById('voice-section');
  if (!speakers.length) {
    sec.innerHTML = '<div style="color:var(--t3);font-size:12px">加载台词后显示角色音色配置。</div>';
    return;
  }
  sec.innerHTML = speakers.map(spk => {
    const v = voices[spk] || { voice_id: '', speed: 0.9, vol: 1, pitch: 0 };
    return `
    <div class="voice-card">
      <div class="voice-card-name">${spk}</div>
      <div class="voice-id-row">
        <input class="voice-id-input" placeholder="voice_id"
          value="${v.voice_id||''}"
          onchange="updateVoice('${spk}','voice_id',this.value)">
        <button class="voice-preview-btn" data-preview="${spk}"
          onclick="previewVoice('${spk}')">试听</button>
      </div>
      <div class="voice-params">
        <div class="param-group">
          <span class="param-label">语速</span>
          <input class="param-input" type="number" step="0.1" min="0.5" max="2"
            value="${v.speed||0.9}"
            onchange="updateVoice('${spk}','speed',+this.value)">
        </div>
        <div class="param-group">
          <span class="param-label">音量</span>
          <input class="param-input" type="number" step="0.1" min="0.1" max="10"
            value="${v.vol||1}"
            onchange="updateVoice('${spk}','vol',+this.value)">
        </div>
        <div class="param-group">
          <span class="param-label">声调</span>
          <input class="param-input" type="number" step="1" min="-12" max="12"
            value="${v.pitch||0}"
            onchange="updateVoice('${spk}','pitch',+this.value)">
        </div>
      </div>
    </div>`;
  }).join('');
}

async function updateVoice(speaker, key, value) {
  if (!voices[speaker]) voices[speaker] = { voice_id:'', speed:0.9, vol:1, pitch:0 };
  voices[speaker][key] = value;
  try {
    await api('PATCH', `/api/projects/${currentProjectId}`, { voices });
  } catch(e) { toast('音色保存失败'); }
}

// ── Voice generation ──────────────────────────────────────────
function playLineAudio(lineId) {
  const l = lines.find(x => x.id === lineId);
  if (!l || l.audio_status !== 'done') return;
  playUrl(`/storage/${currentProjectId}/audio/${lineId}.mp3?t=${Date.now()}`);
}

async function ttsOneLine(lineId) {
  const l = lines.find(x => x.id === lineId);
  if (!l) return;
  const v = voices[l.speaker];
  if (!v?.voice_id) { toast(`请先为「${l.speaker}」配置 voice_id`); return; }
  l.audio_status = 'generating';
  renderLines();
  try {
    const res = await api('POST', `/api/tts/lines/${lineId}`);
    Object.assign(l, res);
    renderLines();
    toast('配音完成');
  } catch (e) {
    l.audio_status = 'error';
    l.error_msg = e.message;
    renderLines();
    toast('配音失败：' + e.message);
  }
}

let _batchSSE = null;
async function generateAllVoice() {
  const speakers = [...new Set(lines.map(l => l.speaker))];
  const missing = speakers.filter(s => !voices[s]?.voice_id);
  if (missing.length) { toast('未配置 voice_id：' + missing.join('、')); return; }
  if (_batchSSE) { toast('批量配音正在进行中'); return; }

  const btn = document.getElementById('btn-voice');
  const fill = document.getElementById('progress-fill');
  const txt = document.getElementById('progress-text');
  btn.disabled = true;
  txt.style.display = '';
  txt.textContent = '准备中...';
  fill.style.width = '0%';

  let total = 0, done = 0, ok = 0, failed = 0;
  try {
    const resp = await fetch(`/api/tts/projects/${currentProjectId}/batch`, { method:'POST' });
    if (!resp.ok || !resp.body) {
      const err = await resp.json().catch(()=>({detail:resp.statusText}));
      throw new Error(err.detail || resp.statusText);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done: rdone } = await reader.read();
      if (rdone) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const block of parts) {
        const m = block.match(/^data:\s*(.+)$/m);
        if (!m) continue;
        const evt = JSON.parse(m[1]);
        if (evt.type === 'start') {
          total = evt.total;
          txt.textContent = total === 0 ? '没有需要生成的台词' : `0 / ${total}`;
        } else if (evt.type === 'progress') {
          const l = lines.find(x => x.id === evt.line_id);
          if (l) {
            l.audio_status = evt.status;
            if (evt.status === 'done') {
              l.duration_ms = evt.duration_ms;
              l.error_msg = null;
            } else if (evt.status === 'error') {
              l.error_msg = evt.error;
            }
          }
          if (evt.status === 'done') { done++; ok++; }
          else if (evt.status === 'error') { done++; failed++; }
          if (total) {
            fill.style.width = (done/total*100) + '%';
            txt.textContent = `${done} / ${total} · ${evt.speaker} ${evt.status==='done'?'✓':evt.status==='error'?'✗':'…'}`;
          }
          renderLines();
        } else if (evt.type === 'error') {
          throw new Error(evt.message);
        } else if (evt.type === 'done') {
          txt.textContent = `完成：成功 ${evt.ok} / 失败 ${evt.failed}`;
          fill.style.width = '100%';
        }
      }
    }
    toast(failed ? `完成（${failed} 条失败）` : `配音完成（${ok} 条）`);
  } catch (e) {
    toast('批量配音失败：' + e.message);
    txt.textContent = '失败：' + e.message;
  } finally {
    _batchSSE = null;
    btn.disabled = false;
  }
}

async function previewVoice(speaker) {
  const v = voices[speaker];
  if (!v?.voice_id) { toast('请先填写 voice_id'); return; }
  const btn = document.querySelector(`[data-preview="${speaker}"]`);
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const res = await api('POST', '/api/tts/preview', {
      text: `你好，这是${speaker}的试听音频。`,
      voice_id: v.voice_id,
      speed: v.speed || 0.9,
      vol: v.vol || 1,
      pitch: v.pitch || 0,
    });
    playUrl(res.audio_url);
  } catch (e) {
    toast('试听失败：' + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '试听'; }
  }
}

async function generateVideo() {
  toast('视频合成将在 Phase 3 实现');
}

document.getElementById('topbar-actions').style.display = 'none';
loadProjects();
